server:
  port: 8080

spring:
  application:
    name: agri-equipment-rental
  
  # Default datasource: In-memory H2 with Web Console
  datasource:
    url: jdbc:h2:mem:agrirentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  # To switch to MySQL, uncomment below and comment out H2 above:
  # datasource:
  #   url: jdbc:mysql://localhost:3306/agrirent_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  #   username: root
  #   password: your_mysql_password
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # If using MySQL, use: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Security / JWT Configuration
app:
  jwt:
    # 256-bit base64/hex compatible secret key for HS256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
